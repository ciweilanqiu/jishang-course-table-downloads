<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吉商课程表下载</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 32px 18px; background: Canvas; color: CanvasText; }
    main { max-width: 560px; margin: 6vh auto; }
    h1 { font-size: 1.7rem; }
    #status { color: GrayText; }
    #download { display: inline-block; margin: 20px 0; padding: 14px 22px;
      border-radius: 12px; background: #6750a4; color: white; font-weight: 700;
      text-decoration: none; }
    #download[hidden], #details[hidden] { display: none; }
    .secondary { color: GrayText; line-height: 1.6; }
    #notes { white-space: pre-wrap; }
    code { overflow-wrap: anywhere; }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>吉商课程表</h1>
    <p id="status" role="status">正在查询下载信息…</p>
    <section id="details" hidden>
      <p id="version"></p>
      <p id="notes"></p>
      <a id="download" hidden rel="noreferrer">手动下载 APK</a>
      <p class="secondary">如果浏览器没有自动开始下载，请点击上方按钮。安装前请核对来源和版本；下载与安装均由浏览器和 Android 系统处理。</p>
      <p class="secondary">SHA-256：<code id="sha256"></code></p>
    </section>
  </main>
</body>
</html>
